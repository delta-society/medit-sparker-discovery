name: Native PDF smoke
on:
  push:
    branches: ['codex/pdf-native-ci-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Render PDF with installed native browser
        run: python -X utf8 scripts/verify-pdf-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pdf-${{ matrix.os }}
          path: |
            native-pdf-results/native.pdf
            native-pdf-results/receipt.json
